name: Application Assurance CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  assurance:
    name: Deterministic QA & Security Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Assurance Orchestrator (QA + Security + Verifier)
        run: npm run assurance

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      - name: Publish Assurance Report to Step Summary
        if: always()
        run: |
          if [ -f assurance-results/report.md ]; then
            cat assurance-results/report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Assurance Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-pipeline-report
          path: |
            public/assurance/latest.json
            assurance-results/report.md
            playwright-report/
