name: Deploy Maritime AI Control Tower to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Assurance Gates (QA + Security + Verifier)
        run: npm run assurance

      - name: Build Application for GitHub Pages
        run: npm run build

      - name: Ensure Assurance Report in Distribution
        run: |
          mkdir -p dist/assurance
          cp public/assurance/latest.json dist/assurance/latest.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Built Application Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
